name: Cairn 500 USDT Commissioning Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/cairn-paper500-commissioning-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4aeb5920ac81875b92b636d330e645170d429f59
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Verify actual startup runs and artifact receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, sys, time
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0,'scripts')
          import paper500_ops as ops
          from cairn import paper500 as p
          root=Path('commissioning-evidence'); root.mkdir()
          target='f66d8329641d47afd48d9d050e49f2cd15e929fb'
          for attempt in range(60):
              runs=ops.js(f'/repos/{ops.REPO}/actions/runs?head_sha={target}&per_page=100')['workflow_runs']
              runs=[r for r in runs if re.fullmatch(r'CAIRN-\d{2} Full Paper Cycle \(500 USDT\)',r['name'])]
              if len(runs)==15 and all(r['status']=='completed' for r in runs): break
              time.sleep(5)
          workflows=ops.js(f'/repos/{ops.REPO}/actions/workflows?per_page=100')['workflows']
          workers=[w for w in workflows if re.fullmatch(r'CAIRN-\d{2} Full Paper Cycle \(500 USDT\)',w['name'])]
          statuses=[{'name':r['name'],'run_id':r['id'],'status':r['status'],'conclusion':r['conclusion'],
                     'created_at':r['created_at'],'workflow_id':r['workflow_id']} for r in runs]
          ops.save(root/'workflow-runs.json',statuses)
          ops.save(root/'workflow-state.json',workers)
          p.require(len(workers)==15 and all(w['state']=='active' for w in workers),'NOT_ALL_15_WORKFLOWS_ACTIVE')
          p.require(len(runs)==15 and all(r['conclusion']=='success' for r in runs),'COMMISSIONING_RUN_FAILURE')
          artifacts=ops.js(f'/repos/{ops.REPO}/actions/artifacts?name={p.STATE_ARTIFACT}&per_page=100')['artifacts']
          latest=max((a for a in artifacts if a['name']==p.STATE_ARTIFACT),key=lambda a:(a['created_at'],a['id']))
          files=ops.unzip_checked(ops.gh(f"/repos/{ops.REPO}/actions/artifacts/{latest['id']}/zip"),latest)
          ledger=p.verify_database if False else ops.validate_state_files(files,root/'shared-checkpoint')
          store=p.Store(root/'shared-checkpoint/ledger.sqlite3')
          fills=[]; rows=[]
          for run in sorted(runs,key=lambda r:r['name']):
              arts=ops.js(f"/repos/{ops.REPO}/actions/runs/{run['id']}/artifacts")['artifacts']
              accepted=next(a for a in arts if a['name']==f"cairn-acceptance500-{run['id']}")
              payload=ops.unzip_checked(ops.gh(f"/repos/{ops.REPO}/actions/artifacts/{accepted['id']}/zip"),accepted)
              receipt=json.loads(payload['cycle-report.json'])
              saved=store.get_record(receipt['cycle_key']+':report')
              p.require(saved is not None and saved['status']=='LOCAL_COMMITTED','MISSING_PERSISTED_REPORT')
              p.require(receipt['status']=='COMPLETED' and receipt['remote_persistence_verified'] is True
                        and receipt['audit_chain_valid'] is True,'INVALID_ACCEPTANCE_RECEIPT')
              p.require(saved['fills']==receipt['fills'] and len(receipt['fills'])==1,'FILL_EVIDENCE_MISMATCH')
              fill=receipt['fills'][0]
              p.require(p.F(fill['fill_quantity'])>0 and fill['simulated_fill'] is True
                        and fill['live_order_submitted'] is False,'INVALID_PAPER_FILL')
              p.require(receipt['stages']['reconciliation']['status']=='MATCH','RECONCILIATION_MISMATCH')
              p.require(p.F(receipt['stages']['risk']['post_position_nav'])<=p.POSITION_CAP,'POSITION_CAP_FAILURE')
              fills.append(fill)
              rows.append({'runner':receipt['runner'],'cycle_id':receipt['cycle_id'],
                    'run_id':run['id'],'workflow_id':run['workflow_id'],'status':'COMPLETED',
                    'invocation_kind':receipt['invocation_kind'],'side':fill['side'],
                    'quantity':fill['fill_quantity'],'price':fill['fill_price'],'fee':fill['fee'],
                    'notional':fill['notional'],'action_id':fill['action_id'],
                    'reconciliation':'MATCH','remote_persistence_verified':True,
                    'post_sequence':receipt['account_after']['sequence']})
              ops.save(root/'acceptance'/f"{receipt['runner']}.json",receipt)
          p.require(len({f['action_id'] for f in fills})==15,'DUPLICATE_ACTION_ID')
          genesis=store.get_record(p.EPOCH+':genesis')
          p.require(p.from_rational(genesis['cash'])==500 and genesis['sequence']==0,'INITIAL_CAPITAL_NOT_500')
          state=p.decode_state(ledger['state'])
          summary={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'epoch':p.EPOCH,
                   'initial_capital':'500','currency':'USDT','worker_platform':'GITHUB_ACTIONS_NOT_CHATGPT_TASKS',
                   'active_workers':len(workers),'verified_commissioning_workers':len(rows),
                   'verified_nonzero_fills':len(fills),'core_fills':0,
                   'native_chatgpt_tasks_resumed':False,'full_strategy_cycle_completed':False,
                   'code_sha':'4aeb5920ac81875b92b636d330e645170d429f59',
                   'shared_state_artifact_id':latest['id'],'shared_state_sequence':state.sequence,
                   'cash':p.D(state.cash),'fees_paid':p.D(state.fees_paid),
                   'positions':{k:p.D(v.quantity) for k,v in state.positions.items()},
                   'last_marked_nav':p.D(p.from_rational(ledger['state']['last_nav'])),
                   'audit_chain_valid':True,'legacy_100000_history_overwritten':False,'workers':rows}
          ops.save(root/'commissioning-summary.json',summary)
          (root/'README.md').write_text('# Cairn 500-USDT commissioning evidence\n\n'
              '15 separate GitHub workers, not restored ChatGPT Tasks.\n\n'
              'Read commissioning-summary.json and per-worker acceptance receipts.\n\n'
              'Fills use real newly fetched OKX public quotes in local paper simulation. No live or OKX demo-account order was submitted.\n\n'
              'CORE alpha is unavailable. Startup verification is not proof of indefinite uptime or investment edge.\n')
          print(json.dumps(summary,sort_keys=True))
          PY
      - name: Preserve complete independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-paper500-commissioning-${{ github.run_id }}
          path: commissioning-evidence/
          retention-days: 90
          if-no-files-found: error
