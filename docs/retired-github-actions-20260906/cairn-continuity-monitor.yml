name: Cairn 500 USDT Continuous-operation Monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
      timezone: Australia/Adelaide
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cairn_continuity_monitor.py
      - tests/test_cairn_continuity_monitor.py
      - .github/workflows/cairn-continuity-monitor.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: cairn-readonly-continuity-monitor
  queue: max
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Test monitoring logic without exchange calls
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m pytest -q -o addopts='' tests/test_cairn_continuity_monitor.py
      - name: Inspect schedules and validate uploaded cumulative ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cairn_continuity_monitor.py
      - name: Preserve all continuity findings including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cairn-continuity-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuity-output/
          retention-days: 30
          if-no-files-found: error
