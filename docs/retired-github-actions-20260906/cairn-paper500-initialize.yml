name: Cairn 500 USDT Explicit Initialization
on:
  push:
    branches: [main]
    paths: [.github/workflows/cairn-paper500-initialize.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cairn-paper500-account
  queue: max
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4aeb5920ac81875b92b636d330e645170d429f59
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Explicit initialization or restore of existing 500 epoch
        id: init
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/paper500_ops.py initialize
      - name: Persist initial checkpoint
        id: state
        if: steps.init.outputs.state_verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cairn-state-cairn-500-usdt-20260906-v1
          path: state500/
          retention-days: 90
          if-no-files-found: error
      - name: Independently download and verify uploaded capital
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ID: ${{ steps.state.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import paper500_ops as ops
          from cairn import paper500 as p
          aid=os.environ['STATE_ID']
          p.require(aid.isdigit(),'MISSING_UPLOAD_ID')
          meta=ops.js(f'/repos/{ops.REPO}/actions/artifacts/{aid}')
          p.require(meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']),'WRONG_UPLOAD_RUN')
          files=ops.unzip_checked(ops.gh(f'/repos/{ops.REPO}/actions/artifacts/{aid}/zip'),meta)
          result=ops.validate_state_files(files,Path('initial-readback'))
          state=p.decode_state(result['state'])
          p.require(state.sequence==0 and state.cash==500 and not state.positions,'NOT_FRESH_500_EPOCH')
          receipt={'epoch':p.EPOCH,'initial_capital':'500','currency':'USDT','sequence':0,
                   'positions':{},'remote_persistence_verified':True,'audit_chain_valid':True,
                   'legacy_account_overwritten':False,'artifact_id':int(aid)}
          ops.save(Path('paper500-output/initialization-verified.json'),receipt)
          print(receipt)
          PY
      - name: Preserve initialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-paper500-initialization-${{ github.run_id }}
          path: paper500-output/
          retention-days: 90
          if-no-files-found: error
