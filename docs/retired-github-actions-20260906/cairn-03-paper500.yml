name: CAIRN-03 Full Paper Cycle (500 USDT)
on:
  schedule:
    - cron: '8 * * * *'
      timezone: Australia/Adelaide
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cairn-03-paper500.yml]
permissions:
  contents: read
  actions: read
jobs:
  cycle:
    uses: ./.github/workflows/cairn-paper500-worker.yml
    with:
      runner: 3
