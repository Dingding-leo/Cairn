name: Cairn 500 USDT Validation
on:
  push:
    branches: [fix/paper500-continuity]
    paths:
      - src/cairn/paper500.py
      - scripts/paper500_ops.py
      - tests/test_paper500*.py
      - .github/workflows/paper500-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Full regression suite
        run: python -m pytest -q --junitxml=validation/full-results.xml
      - name: Focused new-engine branch coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run --branch --source=cairn.paper500 -m pytest -q tests/test_paper500.py tests/test_paper500_transport.py
          python -m coverage report --fail-under=95 | tee validation/coverage.txt
          python -m compileall -q src scripts/paper500_ops.py
      - name: Export verification and exact source
        if: always()
        run: |
          git archive --format=zip HEAD -o validation/tested-source.zip
          git rev-parse HEAD > validation/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-paper500-validation-${{ matrix.python }}-${{ github.run_id }}
          path: validation/
          retention-days: 90
          if-no-files-found: error
