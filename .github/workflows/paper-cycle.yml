name: Cairn Legacy Paper Epoch Retired
on:
  push:
    branches: [auto/paper-cycle-runner]
    paths:
      - scripts/run_full_paper_cycle_v2.py
      - scripts/run_full_paper_cycle_v3.py
      - scripts/run_full_paper_cycle_v4.py
      - scripts/run_full_paper_cycle_v5.py
      - .github/workflows/paper-cycle.yml
      - .cairn/current-cycle.txt
      - .cairn/triggers/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed rather than continue obsolete 100000 USDT account
        shell: bash
        run: |
          mkdir -p retirement
          cat > retirement/incident.json <<'JSON'
          {"status":"HALTED","reason":"LEGACY_100000_USDT_EPOCH_RETIRED","orders_submitted":0,"live_order_submitted":false,"active_epoch":"cairn-500-usdt-20260906-v1","replacement":"Fifteen cairn-01-paper500.yml through cairn-15-paper500.yml workflows on main","schedule_action":"NONE","legacy_history_overwritten":false}
          JSON
          cat retirement/incident.json
          echo 'The owner requested 500 USDT initial capital. The old epoch is preserved, not reused. See docs/PAPER500-OPERATIONS.md on main.'
          exit 1
      - name: Preserve explicit retirement incident
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-legacy-retirement-${{ github.run_id }}
          path: retirement/
          retention-days: 90
          if-no-files-found: error
