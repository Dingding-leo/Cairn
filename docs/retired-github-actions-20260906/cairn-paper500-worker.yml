name: Cairn Shared 500 USDT Paper Executor
on:
  workflow_call:
    inputs:
      runner:
        type: number
        required: true
permissions:
  contents: read
  actions: read
jobs:
  cycle:
    name: Worker ${{ inputs.runner }} full paper execution and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cairn-paper500-account
      queue: max
      cancel-in-progress: false
    env:
      CAIRN_CODE_SHA: 4aeb5920ac81875b92b636d330e645170d429f59
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4aeb5920ac81875b92b636d330e645170d429f59
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned audited execution code and tested dependency versions
        run: >-
          python -m pip install -e .
          'pydantic==2.13.5' 'pydantic-core==2.46.5'
          'annotated-types==0.8.0' 'typing-extensions==4.16.0' 'typing-inspection==0.4.4'
      - name: Restore and authenticate cumulative 500 USDT checkpoint
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/paper500_ops.py restore
      - name: Execute isolated paper cycle
        id: execute
        env:
          CAIRN_RUNNER: ${{ inputs.runner }}
        run: python scripts/paper500_ops.py run --runner "$CAIRN_RUNNER"
      - name: Persist shared account and full audit chain
        id: state
        if: steps.execute.outputs.state_verified == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cairn-state-cairn-500-usdt-20260906-v1
          path: state500/
          retention-days: 90
          if-no-files-found: error
      - name: Persist cycle or explicit failure evidence
        id: cycle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cairn-cycle500-${{ github.run_id }}
          path: paper500-output/
          retention-days: 90
          if-no-files-found: error
      - name: Download both artifacts and verify committed nonzero fill
        if: steps.state.outcome == 'success' && steps.cycle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ID: ${{ steps.state.outputs.artifact-id }}
          CYCLE_ID: ${{ steps.cycle.outputs.artifact-id }}
        run: python scripts/paper500_ops.py verify --state-id "$STATE_ID" --cycle-id "$CYCLE_ID"
      - name: Publish verified acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cairn-acceptance500-${{ github.run_id }}
          path: paper500-acceptance/
          retention-days: 90
          if-no-files-found: warn
