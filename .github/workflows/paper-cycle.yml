name: Cairn Paper Cycle

on:
  push:
    branches: [auto/paper-cycle-runner]
    paths:
      - scripts/run_full_paper_cycle_v2.py
      - scripts/run_full_paper_cycle_v3.py
      - scripts/run_full_paper_cycle_v4.py
      - scripts/run_full_paper_cycle_v5.py
      - .github/workflows/paper-cycle.yml
      - .cairn/current-cycle.txt
      - .cairn/triggers/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cairn-shared-paper-account
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Cairn
        run: python -m pip install -e .
      - name: Restore latest shared paper state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cairn-shared-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/cairn-state.zip
            unzip -oq /tmp/cairn-state.zip -d state
          fi
      - name: Run complete paper cycle
        run: python scripts/run_full_paper_cycle_v5.py
      - name: Verify report and non-zero paper fill
        shell: bash
        run: |
          set -euo pipefail
          report="$(find artifacts -name cycle-report.json -print -quit)"
          expected="$(tr -d '\r\n' < .cairn/current-cycle.txt)"
          python - "$report" "$expected" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          expected=sys.argv[2]
          assert p["status"] == "COMPLETED", p
          assert p["cycle_id"] == expected, (p, expected)
          assert p["minimum_paper_trade_per_cycle_satisfied"] is True, p
          assert p["audit_chain_valid"] is True, p
          assert p["reconciliation"]["internal_ledger"] == "MATCH", p
          fill=p["exploration"]["fill"]
          assert float(fill["fill_quantity"]) > 0, fill
          assert fill["simulated_fill"] is True, fill
          assert fill["live_order_submitted"] is False, fill
          assert fill["execution_mode"] == "LOCAL_PAPER_LEDGER", fill
          print(json.dumps({"cycle_id":p["cycle_id"],"fill":fill,"reconciliation":p["reconciliation"]}, sort_keys=True))
          PY
      - name: Upload cycle record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-cycle-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Upload shared paper state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-shared-state
          path: state/account.json
          retention-days: 30
