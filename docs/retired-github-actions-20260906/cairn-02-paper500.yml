name: CAIRN-02 Full Paper Cycle (500 USDT)
on:
  schedule:
    - cron: '4 * * * *'
      timezone: Australia/Adelaide
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cairn-02-paper500.yml]
permissions:
  contents: read
  actions: read
jobs:
  cycle:
    uses: ./.github/workflows/cairn-paper500-worker.yml
    with:
      runner: 2
