[mypy]
python_version = 3.11
check_untyped_defs = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
ignore_missing_imports = True

# Strict mode is a roadmap target for the canonical GitHub port. The original
# release-candidate package had broader generated contracts; we do not mask that
# difference by claiming strict typing before this smaller publication core is clean.
disallow_untyped_defs = False
